name: CI with Build-Fixer Agent
on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      build_failed: ${{ steps.test_step.outcome == 'failure' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - id: test_step
        name: Run tests
        run: |
          set +e
          pytest tests/ --tb=short > build_log.txt 2>&1
          code=$?
          cat build_log.txt
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

  agent-fix:
    needs: test
    if: needs.test.outputs.build_failed == 'true'
    runs-on: ubuntu-latest
    environment: agent-proposed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build-log }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install anthropic PyGithub
      - name: Run build-fixer agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: python scripts/build_fixer_agent.py --source src/calculator.py --log build_log.txt
